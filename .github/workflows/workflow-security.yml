name: Workflow security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-lockfile:
    name: Verify the Actions lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned lockfile verifier
        shell: pwsh
        run: gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh actions-lock --verify

  release-script-validation:
    name: Validate release helper syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check release draft helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD '.github/scripts/prepare-release-draft.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Release draft helper has PowerShell syntax errors.'
          }

  zizmor:
    name: Audit workflow security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Reject unsafe pull request target triggers
        shell: pwsh
        run: |
          $trigger = 'pull_request_' + 'target'
          $triggerMatches = Get-ChildItem .github/workflows -File -Recurse |
            Select-String -SimpleMatch $trigger
          if ($triggerMatches) {
            $triggerMatches
            throw 'Workflow files must not use the target form of the pull request event.'
          }

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.9.2
        with:
          inputs: .github/workflows
          version: 1.32.0
          persona: auditor
          advanced-security: false
          annotations: true
